<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল ক্রিপ্টো ড্যাশবোর্ড</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg: #0b0e14;
            --panel-bg: #12161f;
            --border: #1f2937;
            --text: #d1d5db;
            --text-dim: #9ca3af;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* হেডার */
        .navbar {
            background: #000;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .nav-title {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--yellow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* টিকার (যেখানে BTC এর দাম লাইভ আপডেট হবে) */
        .ticker-wrap { display: flex; gap: 10px; overflow-x: auto; }
        .ticker {
            background: var(--panel-bg);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-family: 'Roboto Mono';
            font-size: 12px;
            display: flex;
            gap: 6px;
        }
        .up { color: var(--green); }
        .down { color: var(--red); }

        /* মেইন লেআউট */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            padding: 12px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 768px) {
            .dashboard { grid-template-columns: 2fr 1fr; }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .panel-header {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        /* লাইভ চার্ট */
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* মার্কেট গেজ */
        .gauge-box {
            text-align: center;
            padding: 10px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .gauge-value { font-family: 'Roboto Mono'; font-size: 24px; font-weight: 700; margin-top: -30px;}
        .gauge-label { font-size: 11px; color: var(--text-dim); }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .metric-row:last-child { border-bottom: none; }

        /* সিগন্যাল টেবিল */
        .table-wrapper {
            overflow-x: auto; /* এটি টেবিলকে মোবাইলে স্ক্রল করতে দেবে */
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px; /* মোবাইলে টেবিল চেপে যাওয়া রোধ করবে */
            font-size: 12px;
        }
        th { text-align: left; padding: 8px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
        td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-family: 'Roboto Mono'; }
        
        .status { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
        .status-neutral { background: rgba(245, 158, 11, 0.2); color: var(--yellow); }
        .status-bearish { background: rgba(239, 68, 68, 0.2); color: var(--red); }
        .status-bullish { background: rgba(16, 185, 129, 0.2); color: var(--green); }

        .blink { animation: blink 1s infinite alternate; }
        @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-title"><span class="blink" style="color:var(--green);">●</span> CRYPTO PRO DASHBOARD</div>
        <div class="ticker-wrap" id="ticker-container"></div>
    </div>

    <div class="dashboard">
        <!-- চার্ট -->
        <div class="panel">
            <div class="panel-header">
                <span>BTC/USDT লাইভ চার্ট</span>
                <span style="color:var(--green); font-family:'Roboto Mono';" id="chart-price">$0.00</span>
            </div>
            <div class="chart-container">
                <canvas id="liveChart"></canvas>
            </div>
        </div>

        <!-- গেজ ও ইন্ডিকেটর -->
        <div class="panel">
            <div class="panel-header">মার্কেট মুড</div>
            <div class="gauge-box">
                <canvas id="gaugeChart" width="160" height="100"></canvas>
                <div class="gauge-value" id="gauge-val">50</div>
                <div class="gauge-label" id="gauge-text">নিরপেক্ষ</div>
            </div>
            <div class="metric-row"><span>ফান্ডিং রেট</span><span style="color:var(--green)">+০.০১২%</span></div>
            <div class="metric-row"><span>ওপেন ইন্টারেস্ট</span><span>$২৮.৪B</span></div>
            <div class="metric-row"><span>২৪ঘ লিকুইডেশন</span><span style="color:var(--red)">$১২৫.৪M</span></div>
        </div>

        <!-- টেবিল -->
        <div class="panel" style="grid-column: 1 / -1;">
            <div class="panel-header">লাইভ সিগন্যাল টেবিল</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>সিগন্যাল</th><th>কী দেখবেন</th><th>সতর্কতা</th><th>বর্তমান ডেটা</th><th>স্ট্যাটাস</th>
                        </tr>
                    </thead>
                    <tbody id="signal-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ১. লাইভ টিকার আপডেট
        const coins = [{s:"BTC", p:72500, c:1.2}, {s:"ETH", p:3550, c:-0.8}, {s:"SOL", p:175, c:4.5}];
        function updateTicker() {
            document.getElementById('ticker-container').innerHTML = coins.map(coin => {
                let liveP = coin.p + (Math.random()*50-25);
                let isUp = coin.c >= 0;
                return `<div class="ticker">
                    <span>${coin.s}</span>
                    <span style="color:#fff">$${liveP.toFixed(2)}</span>
                    <span class="${isUp?'up':'down'}">${isUp?'+':''}${coin.c}%</span>
                </div>`;
            }).join('');
        }

        // ২. ক্যান্ডেলস্টিক চার্ট
        const canvas = document.getElementById('liveChart');
        const ctx = canvas.getContext('2d');
        let candles = [], lastPrice = 72500;
        
        function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resize); resize();

        function addCandle() {
            const open = lastPrice, close = open + (Math.random()*100-50);
            const high = Math.max(open, close) + (Math.random()*50);
            const low = Math.min(open, close) - (Math.random()*50);
            candles.push({open, close, high, low});
            if(candles.length > 50) candles.shift();
            lastPrice = close;
            document.getElementById('chart-price').innerText = `$${close.toFixed(2)}`;
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(candles.length === 0) return;

            let max = -Infinity, min = Infinity;
            candles.forEach(c => { max = Math.max(max, c.high); min = Math.min(min, c.low); });
            const range = max - min || 1;
            const chartHeight = canvas.height;
            const startX = canvas.width - (candles.length * 12);
            
            candles.forEach((c, i) => {
                const x = startX + i * 12;
                const yOpen = chartHeight - ((c.open - min) / range) * chartHeight;
                const yClose = chartHeight - ((c.close - min) / range) * chartHeight;
                const yHigh = chartHeight - ((c.high - min) / range) * chartHeight;
                const yLow = chartHeight - ((c.low - min) / range) * chartHeight;
                
                const isGreen = c.close > c.open;
                ctx.strokeStyle = isGreen ? '#10b981' : '#ef4444';
                ctx.fillStyle = isGreen ? '#10b981' : '#ef4444';
                
                // লাইন (উইক)
                ctx.beginPath(); ctx.moveTo(x+4, yHigh); ctx.lineTo(x+4, yLow); ctx.stroke();
                // বডি
                ctx.fillRect(x, Math.min(yOpen, yClose), 8, Math.max(1, Math.abs(yOpen-yClose)));
            });
        }

        // ৩. গেজ
        function drawGauge(val) {
            const gCanvas = document.getElementById('gaugeChart');
            const gCtx = gCanvas.getContext('2d');
            gCtx.clearRect(0, 0, 160, 100);
            
            gCtx.beginPath(); gCtx.arc(80, 90, 60, Math.PI, 0); 
            gCtx.lineWidth = 10; gCtx.strokeStyle = '#1f2937'; gCtx.stroke();

            let color = val < 40 ? '#ef4444' : (val > 60 ? '#10b981' : '#f59e0b');
            gCtx.beginPath(); gCtx.arc(80, 90, 60, Math.PI, Math.PI + (val/100)*Math.PI);
            gCtx.strokeStyle = color; gCtx.stroke();

            document.getElementById('gauge-val').innerText = val;
            document.getElementById('gauge-val').style.color = color;
            document.getElementById('gauge-text').innerText = val < 40 ? "ভয় (Fear)" : (val > 60 ? "লোভ (Greed)" : "নিরপেক্ষ");
        }

        // ৪. টেবিল ডেটা
        const signals = [
            {n:"প্রাইস অ্যাকশন", w:"সাপোর্ট ব্রেক", r:"$৭২,৭০০", s:"bullish"},
            {n:"ETF ফ্লো", w:"প্রাতিষ্ঠানিক ক্রয়", r:"-$৫৮.১M", s:"bearish"},
            {n:"ফান্ডিং রেট", w:"লং/শর্ট ব্যালেন্স", r:"০.০০৯%", s:"neutral"},
            {n:"ওপেন ইন্টারেস্ট", w:"লিভারেজ", r:"১৬৩.৫k BTC", s:"neutral"}
        ];
        document.getElementById('signal-table-body').innerHTML = signals.map(x => `
            <tr>
                <td style="color:#fff">${x.n}</td>
                <td style="color:#9ca3af">${x.w}</td>
                <td style="color:#ef4444">${x.r}</td>
                <td><span class="status status-${x.s}">${x.s==='bullish'?'বুলিশ':(x.s==='bearish'?'বিয়ারিশ':'নিরপেক্ষ')}</span></td>
            </tr>
        `).join('');

        // ইনিশিয়ালাইজ
        for(let i=0; i<40; i++) addCandle();
        updateTicker(); drawChart(); drawGauge(45);

        // লাইভ আপডেট লুপ
        setInterval(() => {
            updateTicker();
            if(Math.random() > 0.4) { addCandle(); drawChart(); }
            drawGauge(Math.floor(Math.random()*40+30));
        }, 2000);
    </script>
</body>
</html>
