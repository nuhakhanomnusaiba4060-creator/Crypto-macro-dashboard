
name: Crypto Market Data Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-market-data-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update public crypto market data
        run: python data_engine.py

      - name: Update advanced Spot and on-chain data
        run: python advanced_engine.py

      - name: Update macro data every 6 hours
        shell: bash
        run: |
          HOUR="$(date -u +%H)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$((10#$HOUR % 6))" -eq 0 ]; then
            echo "Refreshing FRED macro data."
            python macro_engine.py
          else
            echo "Keeping the last verified macro snapshot."
          fi

      - name: Recalculate final decision
        run: python decision_engine.py

      - name: Recalculate market phase and zone
        run: python market_zone_engine.py

      - name: Validate all JSON files
        run: |
          python -m json.tool data/market_data.json > /dev/null
          python -m json.tool data/macro_data.json > /dev/null
          python -m json.tool data/decision_data.json > /dev/null
          python -m json.tool data/advanced_data.json > /dev/null
          python -m json.tool data/market_zone_data.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_data.json
          git add data/macro_data.json
          git add data/decision_data.json
          git add data/advanced_data.json
          git add data/market_zone_data.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh crypto spot and macro dashboard data"
            git push
          fi
