
name: Crypto Market Data Update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-market-data-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market data engine
        run: python data_engine.py

      - name: Run macro economy engine
        run: python macro_engine.py

      - name: Run decision engine
        run: python decision_engine.py

      - name: Run advanced intelligence engine
        run: python advanced_engine.py

      - name: Run market zone analysis engine
        run: python market_zone_engine.py

      - name: Validate all JSON files
        run: |
          python -m json.tool data/market_data.json > /dev/null
          python -m json.tool data/macro_data.json > /dev/null
          python -m json.tool data/decision_data.json > /dev/null
          python -m json.tool data/advanced_data.json > /dev/null
          python -m json.tool data/market_zone_data.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_data.json
          git add data/macro_data.json
          git add data/decision_data.json
          git add data/advanced_data.json
          git add data/market_zone_data.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update crypto macro and market zone data"
            git push
          fi
